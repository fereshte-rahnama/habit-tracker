<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Habit-Tracker</title>
</head>
<body>
    <!-- start sidebar section -->
     <div class="dashboard">
        <aside class="sidebar">
            <a href="#" class="logo">
                <img src="./assets/logo.png" alt="logo">
            </a>
        <nav class="sidebar-nav">
            <a href="#dashboard"> 
                <img src="./assets/home-icon.png" alt="home-icon">
            </a>
            <a href="#habits">
                <img src="./assets/stars.png" alt="habit-icon">
            </a>
            <a href="#weekly-overview">
                <img src="./assets/calender.png" alt="calender-icon">
            </a>
            <a href="#chart-provide">
                <img src="./assets/chart.png" alt="chart-icon">
            </a>
        </nav>
            <button class="sidebar-toggle"> > </button>
        </aside>
        
    <!-- end sidebar section -->
      
    <!-- start main section -->
     <div class="center-content">
     <div class="main-content">
     <section class="weekly-tracker">
        <h1>Hey there, 
            <span></span>
        </h1>
        <p>Let's get productive!</p>
        <div class="weekly-calendar">
            <div class="weekly-chart">
                <div class="weekly-chart-progress"></div>
            </div>
            <p class="week-range" id="week-range"></p>
        </div>
        <div class="week-days" id="week-days">
            <!-- days will be generated by javascript -->
        </div>
        <span class="weekly-progress"></span>
             <button class="add-habit">+ Add Habbit</button>
     </section>
     <div class="modal-overlay hidden">
    <div class="habit-modal">
        <h2>Add New Habit</h2>
        <label>Enter Habit:
            <input type="text" placeholder="Enter Your Habit Name..." id="add-habit-name">
        </label>

    <div class="habit-colors">
        <label>Choose a color:</label>
        <input type="color" id="habit-color" value="#c5e2c8">
    </div>

        <div class="modal-actions">
            <button type="button" class="canceltBtn">Cancel</button>
            <button type="button" class="addBtn">Add</button>
        </div>
    </div>
</div>
     </div>

 <section class="weekly-habits">
        <div class="week-header">
            <span class="cell-empty"></span>
            <span class="cell-empty"></span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
            <span>Sun</span>
        </div>
    </section> 
    </div>
     <!-- end main section -->

    <!-- start right panel -->
   <aside class="daily-panel">
    <div class="daily-header">
        <h2 id="daily-date"></h2>

        <div class="daily-navigation">
            <button id="previous-day" type="button">
                <i class="bx bx-left-arrow-alt"></i>
            </button>

            <button id="next-day" type="button">
                <i class="bx bx-right-arrow-alt"></i>
            </button>
        </div>
    </div>

    <div class="daily-progress">
        <div class="daily-progress-bar">
            <div class="daily-progress-fill"></div>
        </div>

        <p class="daily-progress-text">
            0% of daily goal achieved
        </p>
    </div>

    <div class="daily-habits">
        <!-- کارت‌های عادت با JavaScript ساخته می‌شوند -->
    </div>
</aside>
    </div>
   
     <script src="./js/style.js"></script>
</body>
</html>
